[package]
name = "explorer"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"
links = ["xcb", "gtk-3", "gdk-3", "gio-2.0", "gobject-2.0", "glib-2.0", "pango-1.0", "pangocairo-1.0", "cairo", "gdk_pixbuf-2.0"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "919bb6fe3c58cf703fb1179c2926b655e35ab97b"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "af027a528c6e42b44b68fdaa90b13a7c1136d161"

[exports]
model = "src/model.zi"
app_host = "src/app_host.zi"

[install]
bin = "explorer"

[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
backend = "desktop"
assets = "assets"

[tool.kryon.profiles.shot]
backend = "pixmap"
assets = "assets"

[tool.kryon.install]
profile = "desktop"
name = "Explorer"
icon_name = "system-file-manager"
comment = "Ziran file manager"
categories = "Utility;FileManager;Core;"

[dependencies.data_views]
git = "https://github.com/kryonlabs/data-views.git"
ref = "942fea7809063407e2b4fa9611a2247ab6b3b894"
