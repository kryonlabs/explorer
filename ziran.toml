[package]
name = "explorer"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"
links = ["xcb", "gtk-3", "gdk-3", "gio-2.0", "gobject-2.0", "glib-2.0", "pango-1.0", "pangocairo-1.0", "cairo", "gdk_pixbuf-2.0"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "62d90ff97d10373f44f428bfff538f75185512e5"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "39f7540d193ccaa2096e1115df608da8116b32b7"

[exports]
model = "src/model.zi"
app_host = "src/app_host.zi"

[install]
bin = "explorer"

[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
backend = "desktop"
assets = "assets"

[tool.kryon.profiles.shot]
backend = "pixmap"
assets = "assets"

[tool.kryon.install]
profile = "desktop"
name = "Explorer"
icon_name = "system-file-manager"
comment = "Ziran file manager"
categories = "Utility;FileManager;Core;"

[dependencies.data_views]
git = "https://git.waozi.xyz/kryonlabs/data-views.git"
ref = "62603bdb75efdb50bda53e7d648cfe0dfc1623fd"

[dependencies.taiji_sdk]
git = "https://git.waozi.xyz/taijios/taijios.git"
ref = "a8290241a083b72a4553e467a87c0d94fee7d038"
