[package]
name = "explorer"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"
links = ["xcb", "gtk-3", "gdk-3", "gio-2.0", "gobject-2.0", "glib-2.0", "pango-1.0", "pangocairo-1.0", "cairo", "gdk_pixbuf-2.0"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "5db3d3c39425d5dfe4bfe4a84e6f6e2e5a810ad0"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "54e5b07fc9e8d97f3a1fdb2a269dcf8c70c88572"

[exports]
model = "src/model.zi"
app_host = "src/app_host.zi"

[install]
bin = "explorer"

[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
backend = "desktop"
assets = "assets"

[tool.kryon.profiles.shot]
backend = "pixmap"
assets = "assets"

[tool.kryon.install]
profile = "desktop"
name = "Explorer"
icon_name = "system-file-manager"
comment = "Ziran file manager"
categories = "Utility;FileManager;Core;"

[dependencies.data_views]
git = "https://git.waozi.xyz/kryonlabs/data-views.git"
ref = "27914331912026561572f4bce277cf78e854cb8b"
